<?xml version="1.0" encoding="UTF-8"?>
<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="72" height="72" fill="url(#bg)" rx="10.799999999999999"/>
  
  <!-- Cosmic ring -->
  <circle cx="36" cy="36" r="25.2" 
          fill="none" stroke="url(#accent)" stroke-width="1.44" opacity="0.5"/>
  
  <!-- Inner ring -->
  <circle cx="36" cy="36" r="18" 
          fill="none" stroke="url(#accent)" stroke-width="1.08" opacity="0.7"/>
  
  <!-- Center dot -->
  <circle cx="36" cy="36" r="5.76" fill="url(#accent)"/>
  
  <!-- Orbital dots -->
  <circle cx="36" cy="10.8" r="2.16" fill="#00d4ff"/>
  <circle cx="57.599999999999994" cy="48.24" r="1.8" fill="#7c3aed"/>
  <circle cx="14.400000000000002" cy="48.24" r="1.8" fill="#00d4ff" opacity="0.7"/>
  
  <!-- Data lines -->
  <line x1="25.200000000000003" y1="61.2" 
        x2="32.4" y2="61.2" 
        stroke="#00d4ff" stroke-width="0.72" opacity="0.6"/>
  <line x1="36" y1="61.2" 

  <circle cx="76.8" cy="64.32" r="2.4000000000000004" fill="#7c3aed"/>
  <circle cx="19.200000000000003" cy="64.32" r="2.4000000000000004" fill="#00d4ff" opacity="0.7"/>
  
  <!-- Data lines -->
  <line x1="33.6" y1="81.6" 
        x2="43.2" y2="81.6" 
        stroke="#00d4ff" stroke-width="0.96" opacity="0.6"/>
  <line x1="48" y1="81.6" 

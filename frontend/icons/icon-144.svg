  <!-- Center dot -->
  <circle cx="72" cy="72" r="11.52" fill="url(#accent)"/>
  
  <!-- Orbital dots -->
  <circle cx="72" cy="21.6" r="4.32" fill="#00d4ff"/>
  <circle cx="115.19999999999999" cy="96.48" r="3.6" fill="#7c3aed"/>
  <circle cx="28.800000000000004" cy="96.48" r="3.6" fill="#00d4ff" opacity="0.7"/>
  
  <!-- Data lines -->
  <line x1="50.400000000000006" y1="122.4" 
        x2="64.8" y2="122.4" 
        stroke="#00d4ff" stroke-width="1.44" opacity="0.6"/>
  <line x1="72" y1="122.4" 

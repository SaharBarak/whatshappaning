services:
  - type: web
    name: whatshappening-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install --include=optional || npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: whatshappening-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: NPM_CONFIG_OPTIONAL
        value: "true"

  - type: web
    name: whatshappening-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: echo "Static site - no build required"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=300
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: whatshappening-db
    databaseName: whatshappening
    region: oregon
    plan: free
    ipAllowList: []

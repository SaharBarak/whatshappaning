name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Backend tests - runs on all PRs and pushes
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --ignore-optional

      - name: Run tests
        working-directory: backend
        run: npm test

  # Frontend validation - ensure static files are valid
  frontend-validate:
    name: Frontend Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML exists
        run: |
          if [ ! -f frontend/index.html ]; then
            echo "Error: frontend/index.html not found"
            exit 1
          fi
          echo "✓ Frontend static files present"

  # Deploy backend to Render (only on main push)
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "✓ Render deploy triggered"
          else
            echo "⚠ RENDER_DEPLOY_HOOK_URL not set - skipping deploy"
            echo "Set up a Deploy Hook in Render dashboard and add it as a repository secret"
          fi

  # Deploy frontend to Vercel (only on main push)
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [frontend-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: '--prod'
        if: ${{ secrets.VERCEL_TOKEN != '' }}

      - name: Vercel not configured
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: |
          echo "⚠ Vercel secrets not configured - skipping deploy"
          echo "Required secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
